<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport de Formation et Accompagnement</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

:root{
    --km-blue:#0068B4;
    --km-blue-dark:#00395E;
    --km-blue-darker:#001E33;
    --km-blue-light:#EAF4FB;
    --km-accent:#00A9E0;
    --ink:#1B2733;
    --grey:#667380;
    --line:#DCE4EA;
}

*{
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:linear-gradient(180deg,#F2F6FA 0%,#E7EEF4 100%);
    margin:0;
    padding:24px 16px;
    color:var(--ink);
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:0 0 28px 0;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,38,64,0.12);
    border:1px solid var(--line);
}

h1{
    border-bottom:2px solid var(--km-blue);
    padding-bottom:10px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 28px;
    margin-bottom:0;
    background:linear-gradient(120deg,var(--km-blue-darker) 0%,var(--km-blue-dark) 55%,var(--km-blue) 100%);
}

.header img{
    height:34px;
    width:auto;
    background:#fff;
    padding:8px 14px;
    border-radius:8px;
}

.header h1{
    border-bottom:none;
    padding-bottom:0;
    margin:0;
    font-size:20px;
    letter-spacing:0.5px;
    color:#fff;
    font-weight:700;
}

.form-body{
    padding:26px 28px 0 28px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.grid > div{
    min-width:0;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-size:11px;
    font-weight:700;
    margin-bottom:6px;
    color:var(--km-blue-dark);
    text-transform:uppercase;
    letter-spacing:0.6px;
}

.field{
    display:flex;
    gap:6px;
}

input,textarea,select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:#fbfcfd;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}

input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--km-blue);
    background:#fff;
    box-shadow:0 0 0 3px rgba(0,104,180,0.14);
}

textarea{
    min-height:120px;
}

.section{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
}

.section label{
    font-size:13px;
    color:var(--km-blue-darker);
    position:relative;
    padding-left:12px;
}

.section label::before{
    content:"";
    position:absolute;
    left:0;
    top:1px;
    bottom:1px;
    width:4px;
    border-radius:2px;
    background:var(--km-accent);
}

.mic{
    width:42px;
    min-width:42px;
    cursor:pointer;
    border-radius:6px;
    background:var(--km-blue-light);
    border:1.5px solid var(--line);
    font-size:16px;
}

.mic:hover{
    background:#DCEEFA;
}

.mic-active{
    background:var(--km-blue);
    filter:drop-shadow(0 0 6px rgba(0,104,180,0.6));
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:0.55;}
    100%{opacity:1;}
}

.actions{
    margin-top:26px;
    padding:20px 28px 0 28px;
    border-top:1px solid var(--line);
    display:flex;
    gap:10px;
}

button{
    padding:12px 22px;
    cursor:pointer;
    border:none;
    border-radius:7px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.2px;
    transition:filter .15s ease, transform .05s ease;
}

button:active{
    transform:translateY(1px);
}

.pdf{background:var(--km-blue-darker);color:#fff;}
.pdf:hover{filter:brightness(1.15);}
.mail{background:var(--km-blue);color:#fff;}
.mail:hover{filter:brightness(1.1);}
.reset{background:#fff;color:var(--grey);border:1.5px solid var(--line);}
.reset:hover{background:#F5F7F9;}

@media (max-width:480px){
    .grid{
        grid-template-columns:1fr;
    }
    .header{
        padding:18px 20px;
    }
    .form-body{
        padding:20px 20px 0 20px;
    }
    .actions{
        padding:18px 20px 0 20px;
        flex-wrap:wrap;
    }
}

</style>
</head>

<script>

document.getElementById("f-date").value =
new Date().toISOString().split("T")[0];

// ===========================
// LOGO : conversion en PNG standard (le PNG source est en
// couleurs indexées, ce que jsPDF gère mal via addImage quand on
// lui passe directement l'élément <img> -> PDF corrompu / logo absent).
// On le redessine dans un <canvas> pour obtenir un PNG RGBA classique.
// ===========================
let logoDataUrl = null;
let logoRatio = null; // largeur/hauteur réelle du logo (pour dimensionner correctement dans le PDF)

function convertirLogo(){
    try{
        const img = document.getElementById("logoImg");
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        logoRatio = img.naturalWidth / img.naturalHeight;
        const ctx = canvas.getContext("2d");
        // Fond blanc (le logo est de toute façon posé sur une
        // pastille blanche dans le PDF) puis on dessine le logo par-dessus.
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        // JPEG plutôt que PNG : le décodeur PNG interne de jsPDF
        // gère mal certains PNG réencodés par canvas (texte fin
        // du logo qui ressort pixelisé/bruité). Le JPEG est encodé
        // par le navigateur en RGB standard, sans ce problème.
        logoDataUrl = canvas.toDataURL("image/jpeg", 0.97);
    }catch(e){
        console.error("Erreur conversion logo :", e);
        logoDataUrl = null;
    }
}

(function(){
    const img = document.getElementById("logoImg");
    if(img.complete && img.naturalWidth > 0){
        convertirLogo();
    }else{
        img.onload = convertirLogo;
    }
})();

function v(id){
 const el = document.getElementById(id);
 if(!el) return "";
 return el.value || "";
}

// ===========================
// DICTEE VOCALE
// ===========================

let recognition = null;
let currentTarget = null;
let currentBtn = null;
let recActive = false;
let micPermissionGranted = false;
let sessionBase = "";   // valeur du champ avant le debut de la dictee en cours
let sessionFinal = "";  // texte finalise accumule pendant la dictee en cours
let sessionChunks = []; // historique des segments finalises (pour "efface")

function getRecognition(){

    if(recognition) return recognition;

    const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Dictée vocale non supportée.");
        return null;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    // interimResults = true : le texte s'affiche au fur et a mesure
    // qu'on parle (apercu), puis se fixe une fois la phrase reconnue.
    recognition.interimResults = true;

    // continuous = true : la dictée NE S'ARRETE PAS toute seule
    // apres une phrase, elle continue tant qu'on ne reclique pas
    // sur le micro (ou qu'on ne ferme pas la page).
    recognition.continuous = true;

    // Concatene existant + ajout en gerant l'espacement :
    // rien si l'un des deux est vide, pas d'espace apres un \n.
    function combiner(existant, ajout){
        if(ajout === "") return existant;
        if(existant === "") return ajout;
        if(/\n\s*$/.test(existant)) return existant + ajout;
        return existant + " " + ajout;
    }

    // Recompose le texte finalise a partir de l'historique des
    // segments (permet de "depiler" le dernier segment sur "efface").
    function reconstituer(chunks){
        let r = "";
        chunks.forEach(function(c){ r = combiner(r, c); });
        return r;
    }

    recognition.onresult = function(e){
        if(!currentTarget) return;
        const field = document.getElementById(currentTarget);

        let interimTexte = "";

        for(let i = e.resultIndex; i < e.results.length; i++){
            const res = e.results[i];
            if(res.isFinal){
                const brut = res[0].transcript;

                if(estCommandeToutEffacer(brut)){
                    sessionBase = "";
                    sessionChunks = [];
                    sessionFinal = "";
                }else if(estCommandeEffacer(brut)){
                    sessionChunks.pop();
                    sessionFinal = reconstituer(sessionChunks);
                }else{
                    const texte = appliquerCommandesVocales(brut);
                    if(texte !== ""){
                        sessionChunks.push(texte);
                        sessionFinal = reconstituer(sessionChunks);
                    }
                }
            }else{
                interimTexte = combiner(interimTexte, res[0].transcript);
            }
        }

        // On reconstruit le champ a chaque evenement : base (avant
        // le debut de cette session de dictee) + texte finalise +
        // apercu du texte en cours de reconnaissance.
        field.value = combiner(combiner(sessionBase, sessionFinal), interimTexte);
    };

    // Remplace les commandes vocales de saut de ligne et de
    // ponctuation par les vrais caracteres correspondants.
    // Saut de ligne : "a la ligne" / "nouvelle ligne" / "retour a la ligne"
    // Ponctuation : "virgule" "point" "point d'interrogation"
    // "point d'exclamation" "deux points" "point-virgule" "tiret"
    function appliquerCommandesVocales(texte){
        return texte
            .replace(/\s*(retour\s+à\s+la\s+ligne|nouvelle\s+ligne|à\s+la\s+ligne)\s*/gi, "\n")
            .replace(/\s*point\s+d['’]interrogation\s*/gi, "?")
            .replace(/\s*point\s+d['’]exclamation\s*/gi, "!")
            .replace(/\s*point[\s-]virgule\s*/gi, ";")
            .replace(/\s*deux\s+points\s*/gi, ":")
            .replace(/\s*virgule\s*/gi, ",")
            .replace(/\s*tiret\s*/gi, "-")
            .replace(/\s*point\s*/gi, ".")
            .trim();
    }

    // Commande vocale pour annuler le dernier segment dicte :
    // "efface", "effacer", "efface ça", "supprime", "annule"...
    function estCommandeEffacer(texte){
        const norm = texte
            .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .toLowerCase()
            .replace(/[.,!?;:]/g,"")
            .trim();
        return [
            "efface","effacer","efface ca","efface ça",
            "efface la derniere ligne","efface le dernier mot",
            "supprime","supprimer","annule","annuler"
        ].includes(norm);
    }

    // Commande vocale pour vider entierement le champ (y compris
    // ce qu'il contenait avant le debut de la dictee en cours) :
    // "efface tout", "tout effacer", "vide le champ", "efface le champ"...
    function estCommandeToutEffacer(texte){
        const norm = texte
            .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .toLowerCase()
            .replace(/[.,!?;:]/g,"")
            .trim();
        return [
            "efface tout","tout effacer","effacer tout",
            "vide le champ","vide tout","vider le champ",
            "efface le champ","effacer le champ",
            "supprime tout","supprimer tout"
        ].includes(norm);
    }

    recognition.onend = function(){
        // Si l'utilisateur n'a pas clique pour arreter (coupure
        // reseau, silence prolonge...), on relance automatiquement
        // tant que recActive est toujours vrai.
        if(recActive){
            try{ recognition.start(); }catch(e){}
        }else{
            setMicUI(false);
        }
    };

    recognition.onerror = function(ev){
        if(ev.error === "no-speech" || ev.error === "audio-capture"){
            return; // sera relance par onend si recActive
        }
        recActive = false;
        setMicUI(false);
    };

    return recognition;
}

function setMicUI(active){
    document.querySelectorAll(".mic").forEach(b=>b.classList.remove("mic-active"));
    if(active && currentBtn) currentBtn.classList.add("mic-active");
}

// Demande le micro UNE SEULE FOIS via getUserMedia. Une fois
// accordee, les demarrages suivants de SpeechRecognition ne
// redeclenchent plus la demande d'autorisation.
async function ensureMicPermission(){

    if(micPermissionGranted) return true;

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        micPermissionGranted = true;
        return true;
    }

    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        stream.getTracks().forEach(t=>t.stop());
        micPermissionGranted = true;
        return true;
    }catch(err){
        alert("Micro refusé ou indisponible : " + err.message);
        return false;
    }
}

async function startDictation(target, btn){

    const rec = getRecognition();
    if(!rec) return;

    // Reclic sur le meme champ (ou un autre) pendant que ca ecoute
    // deja => on arrete la dictee en cours.
    if(recActive){
        recActive = false;
        rec.stop();
        setMicUI(false);
        return;
    }

    const ok = await ensureMicPermission();
    if(!ok) return;

    currentTarget = target;
    currentBtn = btn;
    sessionBase = document.getElementById(target).value;
    sessionFinal = "";
    sessionChunks = [];
    recActive = true;
    setMicUI(true);
    rec.start();
}

// PDF

function genererPdfDoc(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const pageW = 210;
const marge = 15;
const largeurUtile = pageW - marge*2; // 180

// Couleurs KM (RGB)
const cBlueDarker = [0,30,51];
const cBlueDark   = [0,57,94];
const cBlue       = [0,104,180];
const cBlueLight  = [234,244,251];
const cLine       = [220,228,234];
const cGrey       = [102,115,128];
const cInk        = [27,39,51];
const cFieldBg    = [251,252,253];

// ---------------------------------------------------------
// BANDEAU D'EN-TÊTE (dégradé simulé + logo + titre)
// Logo en haut à droite, titre sur une ligne dédiée en dessous.
// ---------------------------------------------------------
const hauteurBandeau = 42;
const nbBandes = 60;
for(let i=0;i<nbBandes;i++){
    const t = i / (nbBandes - 1);
    const r = cBlueDarker[0] + (cBlue[0]-cBlueDarker[0]) * t;
    const g = cBlueDarker[1] + (cBlue[1]-cBlueDarker[1]) * t;
    const b = cBlueDarker[2] + (cBlue[2]-cBlueDarker[2]) * t;
    doc.setFillColor(r,g,b);
    const largeurBande = pageW / nbBandes;
    doc.rect(i*largeurBande, 0, largeurBande + 0.5, hauteurBandeau, "F");
}

// Logo sur pastille blanche, en haut à droite.
// Dimensionné dynamiquement à partir du ratio réel de l'image
// (largeur/hauteur), avec une hauteur cible et une largeur max
// pour ne jamais déborder de la page.
const ratioLogo = logoRatio || (1402/188);
const padLogo = 3;
let logoH = 9;
let logoW = logoH * ratioLogo;
const logoWMax = largeurUtile - 20; // sécurité, ne jamais toucher la marge gauche
if(logoW > logoWMax){
    logoW = logoWMax;
    logoH = logoW / ratioLogo;
}
const pastilleW = logoW + padLogo*2;
const pastilleH = logoH + padLogo*2;
const pastilleX = pageW - marge - pastilleW;
const pastilleY = 6;
const logoX = pastilleX + padLogo;
const logoY = pastilleY + padLogo;

doc.setFillColor(255,255,255);
doc.roundedRect(pastilleX, pastilleY, pastilleW, pastilleH, 2, 2, "F");
if(!logoDataUrl){
    // Nouvelle tentative de conversion si elle n'était pas encore prête
    convertirLogo();
}
if(logoDataUrl){
    try{
        doc.addImage(logoDataUrl, "JPEG", logoX, logoY, logoW, logoH);
    }catch(e){
        console.error("Erreur insertion logo dans le PDF :", e);
    }
}

// Titre en blanc, sur une ligne un peu plus bas, sous le logo
doc.setFont(undefined,"bold");
doc.setFontSize(18);
doc.setTextColor(255,255,255);
doc.text("RAPPORT DE FORMATION ET ACCOMPAGNEMENT", marge, 34);
doc.setFont(undefined,"normal");

let y = hauteurBandeau + 12;

// ---------------------------------------------------------
// CHAMPS EN GRILLE (2 colonnes), façon champs de saisie
// Ordre : Client / Date / Durée / Type de journée /
//         Lieu / Réseau / Formateur / Configuration
// ---------------------------------------------------------
const lignes = [
["Client", v("f-client")],
["Date", v("f-date")],
["Durée", v("f-duree")],
["Type de journée", v("f-type-journee")],
["Lieu", v("f-lieu")],
["Réseau", v("f-reseau")],
["Formateur", v("f-formateur")],
["Configuration", v("f-configuration")]
];

const gap = 6;
const colW = (largeurUtile - gap) / 2;
const champHauteur = 14;

function dessinerChamp(x, y, w, h, label, valeur){
    doc.setDrawColor(cLine[0],cLine[1],cLine[2]);
    doc.setFillColor(cFieldBg[0],cFieldBg[1],cFieldBg[2]);
    doc.setLineWidth(0.3);
    doc.roundedRect(x, y, w, h, 1.5, 1.5, "FD");

    doc.setFont(undefined,"bold");
    doc.setFontSize(7.5);
    doc.setTextColor(cBlueDark[0],cBlueDark[1],cBlueDark[2]);
    doc.text(label.toUpperCase(), x+4, y+5.5);

    doc.setFont(undefined,"normal");
    doc.setFontSize(10.5);
    doc.setTextColor(cInk[0],cInk[1],cInk[2]);
    const valTxt = doc.splitTextToSize(valeur || "", w-8);
    doc.text(valTxt[0] || "", x+4, y+11);
}

for(let i=0;i<lignes.length;i+=2){
    dessinerChamp(marge, y, colW, champHauteur, lignes[i][0], lignes[i][1]);
    if(lignes[i+1]){
        dessinerChamp(marge+colW+gap, y, colW, champHauteur, lignes[i+1][0], lignes[i+1][1]);
    }
    y += champHauteur + 4;
}

// Champ Participants (pleine largeur, hauteur variable)
const participantsTxt = doc.splitTextToSize(v("f-participants") || "", largeurUtile-8);
const participantsH = Math.max(champHauteur, 7 + participantsTxt.length*5);
dessinerChamp(marge, y, largeurUtile, participantsH, "Participants", "");
doc.setFont(undefined,"normal");
doc.setFontSize(10.5);
doc.setTextColor(cInk[0],cInk[1],cInk[2]);
doc.text(participantsTxt, marge+4, y+11);
y += participantsH + 10;

// ---------------------------------------------------------
// SECTIONS (CONTENU / ACQUIS / DIFFICULTÉS) avec barre d'accent
// ---------------------------------------------------------
const sections = [
["CONTENU",v("f-contenu")],
["ACQUIS",v("f-acquis")],
["DIFFICULTÉS",v("f-difficultes")]
];

sections.forEach(function(s){

    // Saut de page si besoin
    if(y > 265){
        doc.addPage();
        y = 20;
    }

    doc.setFont(undefined,"bold");
    doc.setFontSize(11.5);
    doc.setTextColor(cBlueDark[0],cBlueDark[1],cBlueDark[2]);
    doc.text(s[0], marge+4, y);

    // Barre d'accent verticale
    doc.setFillColor(0,169,224); // km-accent
    doc.roundedRect(marge, y-4, 1.6, 5.5, 0.8, 0.8, "F");

    y += 6;

    doc.setDrawColor(cLine[0],cLine[1],cLine[2]);
    doc.setLineWidth(0.2);
    doc.line(marge, y, pageW-marge, y);

    y += 6;

    doc.setFont(undefined,"normal");
    doc.setFontSize(10.5);
    doc.setTextColor(cInk[0],cInk[1],cInk[2]);

    let txt = doc.splitTextToSize(s[1] || "", largeurUtile);
    doc.text(txt, marge, y);

    y += txt.length * 5.5 + 10;

});

// ---------------------------------------------------------
// PIED DE PAGE
// ---------------------------------------------------------
const nbPages = doc.internal.getNumberOfPages();
for(let p=1;p<=nbPages;p++){
    doc.setPage(p);
    doc.setDrawColor(cLine[0],cLine[1],cLine[2]);
    doc.setLineWidth(0.2);
    doc.line(marge, 285, pageW-marge, 285);
    doc.setFontSize(8);
    doc.setTextColor(cGrey[0],cGrey[1],cGrey[2]);
    doc.setFont(undefined,"normal");
    doc.text("Version 04/08/2026", marge, 290);
    doc.text(String(p) + " / " + nbPages, pageW-marge, 290, {align:"right"});
}
doc.setTextColor(0,0,0);

return doc;

}

function nomFichierPdf(){
    const client = v("f-client").trim().replace(/[^a-z0-9]+/gi,"-") || "sans-client";
    const date = v("f-date") || new Date().toISOString().split("T")[0];
    const typeJournee = v("f-type-journee").trim().replace(/[^a-z0-9]+/gi,"-") || "sans-type";
    return client + "-" + date + "-" + typeJournee + ".pdf";
}

// ===========================
// Enregistrement / partage du PDF (compatible iPhone)
// ===========================
// Stratégie en cascade :
// 1) Web Share API avec fichiers -> iOS Safari 15+, Android : ouvre le
//    menu de partage natif (Enregistrer dans Fichiers, Mail, etc.)
// 2) Téléchargement classique (doc.save) -> PC, sans dialogue, direct
//    dans le dossier Téléchargements
async function enregistrerOuPartagerPdf(doc, filename, texteAccompagnement){

    const pdfBlob = doc.output("blob");
    let file;
    try{
        file = new File([pdfBlob], filename, {type:"application/pdf"});
    }catch(e){
        file = null; // certains anciens navigateurs n'ont pas le constructeur File
    }

    // 1) Web Share API (indispensable pour iPhone/Android uniquement ;
    //    sur PC, Chrome/Edge supportent aussi canShare({files}) mais on
    //    veut le téléchargement direct, pas le panneau de partage Windows)
    const estMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(estMobile && file && navigator.canShare && navigator.canShare({files:[file]})){
        try{
            await navigator.share({
                files: [file],
                title: filename,
                text: texteAccompagnement || undefined
            });
            return "partage";
        }catch(e){
            if(e && e.name === "AbortError"){
                return "annule"; // l'utilisateur a fermé le menu de partage
            }
            console.log("Partage impossible, on tente une autre méthode :", e);
        }
    }

    // 2) Repli universel desktop : téléchargement direct (dossier
    //    Téléchargements), sans boîte de dialogue.
    doc.save(filename);
    return "telecharge";
}

document.getElementById("btnPdf")
.addEventListener("click", async function () {

    const doc = genererPdfDoc();
    const filename = nomFichierPdf();

    const resultat = await enregistrerOuPartagerPdf(doc, filename);

    if(resultat === "enregistre" || resultat === "telecharge"){
        alert("PDF enregistré avec succès");
    }
    // "partage" : le menu natif iOS/Android gère déjà le retour utilisateur
    // "annule" : l'utilisateur a annulé volontairement, on ne dérange pas

});

// ===========================
// EMAIL
// ===========================

document.getElementById("btnMail")
.addEventListener("click", async function(){

const doc = genererPdfDoc();
const fichierPdf = nomFichierPdf();

const sujet = v("f-client");

const corps = `
RAPPORT DE FORMATION ET ACCOMPAGNEMENT

Client : ${v("f-client")}
Date : ${v("f-date")}
Durée : ${v("f-duree")}
Type de journée : ${v("f-type-journee")}
Lieu : ${v("f-lieu")}
Réseau : ${v("f-reseau")}
Formateur : ${v("f-formateur")}
Configuration : ${v("f-configuration")}
Participants : ${v("f-participants")}

CONTENU

${v("f-contenu")}

ACQUIS

${v("f-acquis")}

DIFFICULTÉS

${v("f-difficultes")}

---
Version 04/08/2026
`;

// 1) Sur iPhone/Android : ouvre le menu de partage natif avec le PDF
//    déjà attaché en pièce jointe. L'utilisateur choisit "Mail" et le
//    fichier est réellement joint (pas de rappel manuel nécessaire).
const pdfBlob = doc.output("blob");
let file = null;
try{
    file = new File([pdfBlob], fichierPdf, {type:"application/pdf"});
}catch(e){}

const estIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const estMobile = estIOS || /Android/i.test(navigator.userAgent);

if(estMobile && file && navigator.canShare && navigator.canShare({files:[file]})){
    try{
        // Sur iOS, l'app Mail ignore le "title" pour l'objet et se base
        // sur la 1re ligne du texte : on y met donc le nom du client.
        // Sur Android, Gmail respecte déjà correctement le "title".
        const corpsPartage = estIOS
        ? sujet + "\n\n" + corps +
          "\n\nÀ envoyer à : formationclientskm@konicaminolta.fr\n" +
          "(le destinataire n'est pas rempli automatiquement, merci de le copier-coller)"
        : "À envoyer à : formationclientskm@konicaminolta.fr\n" +
          "(le destinataire n'est pas rempli automatiquement, merci de le copier-coller)\n" +
          corps;

        await navigator.share({
            files: [file],
            title: sujet,
            text: corpsPartage
        });
        return; // le PDF est déjà joint via le partage natif
    }catch(e){
        if(e && e.name === "AbortError"){
            return; // l'utilisateur a annulé volontairement
        }
        console.log("Partage impossible, on bascule sur mailto :", e);
    }
}

// 2) Repli (desktop / navigateurs sans partage de fichiers) :
//    on télécharge directement le PDF (dossier Téléchargements, sans
//    dialogue) puis on ouvre le client mail avec le texte pré-rempli ;
//    il faudra joindre le fichier manuellement.
doc.save(fichierPdf);

const corpsAvecRappel = corps.replace(
    "---\nVersion 07/08/2026",
    "---\nPensez à joindre le PDF téléchargé (" + fichierPdf + ") avant l'envoi.\n\nVersion 04/08/2026"
);

setTimeout(function(){
    window.location.href =
    "mailto:formationclientskm@konicaminolta.fr?subject=" +
    encodeURIComponent(sujet) +
    "&body=" +
    encodeURIComponent(corpsAvecRappel);
},300);

});
